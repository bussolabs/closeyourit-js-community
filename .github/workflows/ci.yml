# Public CI of bussolabs/closeyourit-js-community (CYRA-914 B8). It runs on GitHub-hosted runners:
# a fork's pull request must never reach the private pool. Releases are cut from the maintainer
# repository, so this workflow only checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm size
      - run: pnpm test
      - run: pnpm run audit:prod
